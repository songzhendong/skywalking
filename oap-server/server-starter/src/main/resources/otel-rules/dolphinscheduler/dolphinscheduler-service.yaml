# DolphinScheduler cluster-level metrics from Prometheus scrape via OpenTelemetry Collector.
# Requires label/resource `cluster` (set in Collector static_configs or resource processor).
# job_name must be `dolphinscheduler-monitoring` (set by Collector metric_relabel_configs).
filter: "{ tags -> tags.job_name == 'dolphinscheduler-monitoring' }"
expSuffix: tag({tags -> tags.cluster = 'dolphinscheduler::' + tags.cluster}).service(['cluster'], Layer.DOLPHINSCHEDULER)
metricPrefix: meter_dolphinscheduler
metricsRules:
  # Workflow / task overview (Service cards + lines)
  - name: workflow_instance_running
    exp: ds_workflow_instance_running.sum(['cluster'])
  - name: task_prepared
    exp: ds_task_prepared.sum(['cluster'])
  - name: worker_active_execute_thread
    exp: ds_worker_active_execute_thread.sum(['cluster'])
  - name: task_success_count
    exp: ds_task_instance_count_total.tagMatch('state', 'success').sum(['cluster']).increase('PT1M')
  - name: task_fail_count
    exp: ds_task_instance_count_total.tagMatch('state', 'fail').sum(['cluster']).increase('PT1M')
  - name: task_timeout_count
    exp: ds_task_instance_count_total.tagMatch('state', 'timeout').sum(['cluster']).increase('PT1M')
  - name: workflow_success_count
    exp: ds_workflow_instance_count_total.tagMatch('state', 'success').sum(['cluster']).increase('PT1M')
  - name: workflow_fail_count
    exp: ds_workflow_instance_count_total.tagMatch('state', 'fail').sum(['cluster']).increase('PT1M')
  - name: task_dispatch_count
    exp: ds_task_dispatch_count_total.sum(['cluster']).increase('PT1M')
  - name: task_dispatch_failure_count
    exp: ds_task_dispatch_failure_count_total.sum(['cluster']).increase('PT1M')
  - name: task_dispatch_error_count
    exp: ds_task_dispatch_error_count_total.sum(['cluster']).increase('PT1M')
  # Prometheus histogram buckets are in seconds; TimeUnit.SECONDS converts stored percentiles to ms (UI unit).
  - name: task_execution_duration_percentile
    exp: ds_task_execution_duration_seconds.sum(['le', 'cluster']).increase('PT1M').histogram("le", TimeUnit.SECONDS).histogram_percentile([50,75,90,95,99])
  - name: workflow_create_command_count
    exp: ds_workflow_create_command_count_total.sum(['cluster']).increase('PT1M')
  - name: workflow_instance_submit_count
    exp: ds_workflow_instance_submit_count_total.sum(['cluster']).increase('PT1M')
