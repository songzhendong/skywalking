# Node.js agent: TLS gRPC + periodic DNS re-resolve via oap.test (/etc/hosts).

services:
  oap:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: oap
    volumes:
      - ../../simple/ssl/certs:/skywalking/certs
    environment:
      SW_CORE_GRPC_SSL_ENABLED: "true"
      SW_CORE_GRPC_SSL_KEY_PATH: /skywalking/certs/server-key.pem
      SW_CORE_GRPC_SSL_CERT_CHAIN_PATH: /skywalking/certs/server.crt
      SW_CORE_GRPC_SSL_TRUSTED_CA_PATH: /skywalking/certs/ca.crt
    ports:
      - 12800

  banyandb:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  provider:
    build:
      context: ..
      dockerfile: Dockerfile.nodejs
      args:
        - SW_AGENT_NODEJS_REPO=${SW_AGENT_NODEJS_REPO}
        - SW_AGENT_NODEJS_COMMIT=${SW_AGENT_NODEJS_COMMIT}
    networks:
      - e2e
    expose:
      - 5000
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap.test:11800
      SW_AGENT_INSTANCE: provider-instance
      SW_AGENT_IS_RESOLVE_DNS_PERIODICALLY: "true"
      SW_AGENT_GRPC_CHANNEL_CHECK_INTERVAL: "1"
      SW_AGENT_FORCE_RECONNECTION_PERIOD: "1"
      SW_AGENT_SSL_TARGET_NAME_OVERRIDE: oap
    volumes:
      - ../../simple/ssl/ca:/app/ca:ro
      - ../provider.ts:/app/provider.ts
      - ./entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      oap:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/5000" ]
      interval: 5s
      timeout: 60s
      retries: 120
    entrypoint: [ "bash", "/entrypoint.sh", "provider.ts" ]

  medium:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: consumer
    environment:
      PROVIDER_URL: http://provider:5000
    depends_on:
      oap:
        condition: service_healthy
      provider:
        condition: service_healthy

  consumer:
    build:
      context: ..
      dockerfile: Dockerfile.nodejs
      args:
        - SW_AGENT_NODEJS_REPO=${SW_AGENT_NODEJS_REPO}
        - SW_AGENT_NODEJS_COMMIT=${SW_AGENT_NODEJS_COMMIT}
    networks:
      - e2e
    ports:
      - 5001
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap.test:11800
      SW_AGENT_INSTANCE: consumer-instance
      SERVER: medium:9092
      SW_AGENT_IS_RESOLVE_DNS_PERIODICALLY: "true"
      SW_AGENT_GRPC_CHANNEL_CHECK_INTERVAL: "1"
      SW_AGENT_FORCE_RECONNECTION_PERIOD: "1"
      SW_AGENT_SSL_TARGET_NAME_OVERRIDE: oap
    volumes:
      - ../../simple/ssl/ca:/app/ca:ro
      - ../consumer.ts:/app/consumer.ts
      - ./entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      oap:
        condition: service_healthy
      medium:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/5001" ]
      interval: 5s
      timeout: 60s
      retries: 120
    entrypoint: [ "bash", "/entrypoint.sh", "consumer.ts" ]

networks:
  e2e:
