# DolphinScheduler metric matrix via mock OTLP replay (29 metric families).
cases:
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service ly DOLPHINSCHEDULER
    expected: expected/service.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql instance ls --service-name=dolphinscheduler::ds-cluster
    expected: expected/instance.yml
  # Service meters
