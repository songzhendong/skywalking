# Real DS cluster integration smoke (service dolphinscheduler::ds-e2e-cluster).
# Full 33-meter matrix: mock/dolphinscheduler-cases.yaml (OTLP JSON replay).
# 2 entity + 3 service + 7 instance metrics = 12 checks.
#
# Omitted vs mock (need workflow load or idle counters that stay empty):
#   service — task/workflow outcome increases, dispatch, execution duration,
#             create_command / submit
#   instance — master overload/consume/failover/RPC, worker overload/full queue,
#             worker_task (absent/null on idle DS 3.2.x), API latency percentile
# API response `code` label is class-based (2xx/4xx/5xx), not numeric status.

cases:
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service ly DOLPHINSCHEDULER
    expected: expected/service.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql instance ls --service-name=dolphinscheduler::ds-e2e-cluster
    expected: expected/instance.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_workflow_instance_running --service-name=dolphinscheduler::ds-e2e-cluster
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_task_prepared --service-name=dolphinscheduler::ds-e2e-cluster
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_worker_active_execute_thread --service-name=dolphinscheduler::ds-e2e-cluster
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_instance_worker_cpu_usage --service-name=dolphinscheduler::ds-e2e-cluster --instance-name=ds-worker-1
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_instance_worker_memory_usage --service-name=dolphinscheduler::ds-e2e-cluster --instance-name=ds-worker-1
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_instance_worker_memory_available --service-name=dolphinscheduler::ds-e2e-cluster --instance-name=ds-worker-1
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_instance_worker_execute_queue_size --service-name=dolphinscheduler::ds-e2e-cluster --instance-name=ds-worker-1
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_instance_worker_active_execute_thread --service-name=dolphinscheduler::ds-e2e-cluster --instance-name=ds-worker-1
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_instance_alert_pending --service-name=dolphinscheduler::ds-e2e-cluster --instance-name=ds-alert-1
    expected: ../mock/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_dolphinscheduler_instance_api_request_count --service-name=dolphinscheduler::ds-e2e-cluster --instance-name=ds-api-1
    expected: ../mock/expected/metrics-has-value.yml
