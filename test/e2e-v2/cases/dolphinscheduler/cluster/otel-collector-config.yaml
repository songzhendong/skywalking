receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: dolphinscheduler-master
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ['ds-master:5679']
              labels:
                cluster: ds-e2e-cluster
                host_name: ds-master-1
          metric_relabel_configs:
            - source_labels: []
              target_label: job_name
              replacement: dolphinscheduler-monitoring
        - job_name: dolphinscheduler-worker
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ['ds-worker:1235']
              labels:
                cluster: ds-e2e-cluster
                host_name: ds-worker-1
          metric_relabel_configs:
            - source_labels: []
              target_label: job_name
              replacement: dolphinscheduler-monitoring
        - job_name: dolphinscheduler-api
          scrape_interval: 15s
          metrics_path: /dolphinscheduler/actuator/prometheus
          static_configs:
            - targets: ['ds-api:12345']
              labels:
                cluster: ds-e2e-cluster
                host_name: ds-api-1
          metric_relabel_configs:
            - source_labels: []
              target_label: job_name
              replacement: dolphinscheduler-monitoring
        - job_name: dolphinscheduler-alert
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ['ds-alert:50053']
              labels:
                cluster: ds-e2e-cluster
                host_name: ds-alert-1
          metric_relabel_configs:
            - source_labels: []
              target_label: job_name
              replacement: dolphinscheduler-monitoring

exporters:
  otlp:
    endpoint: oap:11800
    tls:
      insecure: true

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers:
        - prometheus
      processors:
        - batch
      exporters:
        - otlp
