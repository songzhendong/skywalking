# This file is used to show how to write configuration files and can be used to test.

  cases:
    # send metrics to each oap, just verify OAP cluster is up，
    - query: |
        curl -s -XPOST http://${sender1_host}:${sender1_9093}/sendBatchMetrics/1642647600000/100 > /dev/null;
        curl -s -XPOST http://${sender2_host}:${sender2_9093}/sendBatchMetrics/1642647600000/100 > /dev/null;
        sleep 10;
        curl -s http://${oap1_host}:${oap1_1234} | grep -E '^(remote_out_count|remote_out_latency_count|remote_out_stream_inflight|remote_out_stream_block_seconds|remote_out_queue_used_percentage|remote_in_count|remote_in_latency_count|cluster_size)\{' | awk '{print $1}' | sort
      expected: expected/cluster-up-oap1.yml
    - query: |
        curl -s -XPOST http://${sender1_host}:${sender1_9093}/sendBatchMetrics/1642647600000/100 > /dev/null;
        curl -s -XPOST http://${sender2_host}:${sender2_9093}/sendBatchMetrics/1642647600000/100 > /dev/null;
        sleep 10;
        curl -s http://${oap2_host}:${oap2_1234} | grep -E '^(remote_out_count|remote_out_latency_count|remote_out_stream_inflight|remote_out_stream_block_seconds|remote_out_queue_used_percentage|remote_in_count|remote_in_latency_count|cluster_size)\{' | awk '{print $1}' | sort
      expected: expected/cluster-up-oap2.yml
    - query: |
        curl -s http://${oap1_host}:${oap1_1234} | awk '/^cluster_size\{/{printf "%.0f\n", $2}'
      expected: expected/cluster-size-value.yml
    - query: |
        curl -s http://${oap2_host}:${oap2_1234} | awk '/^cluster_size\{/{printf "%.0f\n", $2}'
      expected: expected/cluster-size-value.yml
    # Semantics: self latency near-zero; peer has out+latency; inbound remote traffic present.
    - query: |
        curl -s http://${oap1_host}:${oap1_1234} | awk '
          /^remote_out_latency_sum\{[^}]*self="Y"/{ys=$2}
          /^remote_out_latency_count\{[^}]*self="Y"/{yc=$2}
          /^remote_out_latency_sum\{[^}]*self="N"/{ns=$2}
          /^remote_out_latency_count\{[^}]*self="N"/{nc=$2}
          /^remote_out_count\{[^}]*self="N"/{no=$2}
          /^remote_in_count\{/{ic=$2}
          END {
            if (yc+0 < 1 || nc+0 < 1 || no+0 < 1 || ic+0 < 1) { print "fail-missing"; exit }
            self_avg = ys / yc
            if (self_avg < 0.001 && no >= 1 && nc >= 1 && ic >= 1) print "ok"
            else printf "fail self_avg=%.6f peer_out=%s peer_lat=%s in=%s\n", self_avg, no, nc, ic
          }'
      expected: expected/remote-so11y-semantics.yml
    - query: |
        curl -s http://${oap2_host}:${oap2_1234} | awk '
          /^remote_out_latency_sum\{[^}]*self="Y"/{ys=$2}
          /^remote_out_latency_count\{[^}]*self="Y"/{yc=$2}
          /^remote_out_count\{[^}]*self="N"/{no=$2}
          /^remote_in_count\{/{ic=$2}
          END {
            if (yc+0 < 1 || no+0 < 1 || ic+0 < 1) { print "fail-missing"; exit }
            self_avg = ys / yc
            if (self_avg < 0.001 && no >= 1 && ic >= 1) print "ok"
            else printf "fail self_avg=%.6f peer_out=%s in=%s\n", self_avg, no, ic
          }'
      expected: expected/remote-so11y-semantics.yml
    # send metrics to each oap first time, UTC 2022-01-26 03:00:00
    - query: |
        curl -s -XPOST http://${sender1_host}:${sender1_9093}/sendBatchMetrics/1643166000000/100;
        curl -s -XPOST http://${sender2_host}:${sender2_9093}/sendBatchMetrics/1643166000000/100;
        sleep 10;
      expected: expected/send-metrics-rsp.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service ls
      expected: expected/service.yml
    # service instance list
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql instance list --service-name=test-service
      expected: expected/service-instance.yml
    # metrics minute
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=test_meter_downsampling_sum --instance-name=test-instance --service-name=test-service --start "2022-01-26 0259" --end "2022-01-26 0301"
      expected: expected/metrics-minute-first.yml
    # metrics toHour
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=test_meter_downsampling_sum --instance-name=test-instance --service-name=test-service --start "2022-01-26 01" --end "2022-01-26 05"
      expected: expected/metrics-hour-first.yml
    # metrics toDay
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=test_meter_downsampling_sum --instance-name=test-instance --service-name=test-service --start "2022-01-26" --end "2022-01-27"
      expected: expected/metrics-day-first.yml
    # send metrics to each oap second time UTC 2022-01-26 03:10:00
    - query: |
        curl -s -XPOST http://${sender1_host}:${sender1_9093}/sendBatchMetrics/1643166600000/100;
        curl -s -XPOST http://${sender2_host}:${sender2_9093}/sendBatchMetrics/1643166600000/100;
        sleep 10;
      expected: expected/send-metrics-rsp.yml
    # metrics minute
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=test_meter_downsampling_sum --instance-name=test-instance --service-name=test-service --start "2022-01-26 0309" --end "2022-01-26 0311"
      expected: expected/metrics-minute-second.yml
    # metrics toHour
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=test_meter_downsampling_sum --instance-name=test-instance --service-name=test-service --start "2022-01-26 01" --end "2022-01-26 05"
      expected: expected/metrics-hour-second.yml
    # metrics toDay
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=test_meter_downsampling_sum --instance-name=test-instance --service-name=test-service --start "2022-01-26" --end "2022-01-27"
      expected: expected/metrics-day-second.yml
